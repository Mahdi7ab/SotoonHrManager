<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Page Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Sotoon HR</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/"
                >Landing</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/logout/"
                >Logout</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      <div class="card text-bg-light mt-3" style="width: 100%">
        <div class="card-header">Add Salary</div>
        <div class="card-body">
          <form
            action="/dashboard/payroll-employee-add-salary/{{uuid}}/"
            method="post"
          >
            <input type="hidden" name="uuid" value="{{uuid}}" />
            {%csrf_token%} {% load bootstrap %} {{ form|bootstrap }}
            <button type="submit" class="btn btn-outline-primary mt-3">
              Add Salary
            </button>
          </form>
          <a href="/dashboard/" class="btn btn-outline-primary mt-3">
            Back to Dashboard
          </a>
          {%if error%}
          <div class="alert alert-info" role="alert">{{ error }}</div>
          {%endif%}
        </div>
      </div>
    </div>
  </body>
</html>
